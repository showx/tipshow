[package]
name = "tipshow-float"
version = "0.1.0"
edition = "2021"
description = "tipshow 桌面悬浮窗"
publish = false
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
notify = "6.1.1"
png = "0.18"
sysinfo = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }
